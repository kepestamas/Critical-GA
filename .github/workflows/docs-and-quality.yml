name: Documentation and Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  documentation-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx numpy matplotlib pyvis
        pip install black flake8 mypy
    
    - name: Check code formatting with Black
      run: |
        black --check --diff *.py
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length compatibility with Black
        flake8 *.py --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Type checking with mypy
      run: |
        mypy --ignore-missing-imports *.py
      continue-on-error: true
    
    - name: Check for documentation updates needed
      run: |
        # Check if any Python files changed without corresponding doc updates
        python .github/scripts/check_doc_sync.py
      continue-on-error: true
    
    - name: Validate README examples
      run: |
        # Extract and validate code examples from README
        python .github/scripts/validate_readme_examples.py
      continue-on-error: true

  test-functionality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install networkx numpy matplotlib pyvis
    
    - name: Test basic functionality
      run: |
        # Test GA with small network
        timeout 60 python connectivity_ga.py karate.txt test 0.1 0.05 10 3 0.8 0.05 || echo "GA test completed"
        
        # Test Greedy algorithm
        timeout 30 python connectivity_greedy.py karate.txt test || echo "Greedy test completed"
        
        # Test network analysis
        python network_analyzer.py karate.txt
    
    - name: Check output files created
      run: |
        # Verify expected output files exist
        ls -la outputs/ || echo "No outputs directory found"
        find . -name "*test*" -type f | head -10

  documentation-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install documentation tools
      run: |
        npm install -g markdownlint-cli
        pip install doc8
    
    - name: Lint Markdown files
      run: |
        markdownlint *.md docs/*.md --ignore node_modules || echo "Markdown linting completed with warnings"
    
    - name: Check documentation structure
      run: |
        # Verify all required documentation files exist
        for file in README.md CONTRIBUTING.md LICENSE CHANGELOG.md; do
          if [ ! -f "$file" ]; then
            echo "Missing required file: $file"
            exit 1
          fi
        done
        
        for file in docs/API.md docs/ALGORITHMS.md docs/DATASETS.md docs/INSTALLATION.md; do
          if [ ! -f "$file" ]; then
            echo "Missing documentation file: $file"
            exit 1
          fi
        done
    
    - name: Check for broken links
      run: |
        # Simple check for obvious broken internal links
        python .github/scripts/check_internal_links.py
      continue-on-error: true